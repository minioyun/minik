<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔷 Şekilleri Öğren - Minik Kaşif</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        #81D4FA,
        #B3E5FC,
        #FFF9C4
    );

    overflow-x:hidden;
}

header{
    padding:22px;
    color:white;
}

header h1{
    font-size:38px;
    text-shadow:2px 2px 6px rgba(0,0,0,.2);
}

header p{
    margin-top:8px;
    font-size:20px;
}

.info{
    width:95%;
    max-width:800px;
    margin:10px auto 20px;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.infoBox{
    background:white;
    padding:11px 17px;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;

    box-shadow:
    0 5px 12px rgba(0,0,0,.15);
}

#question{
    width:92%;
    max-width:800px;
    margin:15px auto;
    padding:20px;

    background:white;
    border-radius:25px;

    font-size:29px;
    font-weight:bold;

    box-shadow:
    0 7px 18px rgba(0,0,0,.15);
}

#shapes{
    width:95%;
    max-width:900px;
    margin:25px auto;

    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:18px;
}

.shapeButton{
    height:150px;

    border:none;
    border-radius:25px;

    background:white;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:10px;

    font-size:20px;
    font-weight:bold;

    box-shadow:
    0 8px 15px rgba(0,0,0,.2);

    transition:.2s;
}

.shapeButton:hover{
    transform:scale(1.06);
}

.shapeButton:active{
    transform:scale(.93);
}

/* ŞEKİLLER */

.shape{
    width:75px;
    height:75px;

    background:#FF595E;

    display:block;
}

/* Kare */

.kare{
    border-radius:8px;
}

/* Daire */

.daire{
    border-radius:50%;
}

/* Üçgen */

.ucgen{
    width:0;
    height:0;

    background:transparent;

    border-left:40px solid transparent;
    border-right:40px solid transparent;
    border-bottom:75px solid #FF595E;
}

/* Dikdörtgen */

.dikdortgen{
    width:100px;
    height:60px;
    border-radius:8px;
}

/* Oval */

.oval{
    width:100px;
    height:65px;
    border-radius:50%;
}

/* Elmas */

.elmas{
    transform:rotate(45deg);
    width:60px;
    height:60px;
    border-radius:8px;
}

/* Kalp */

.kalp{
    background:#FF4FA3;
    transform:rotate(-45deg);
    width:55px;
    height:55px;
    position:relative;
    margin-top:12px;
}

.kalp:before,
.kalp:after{
    content:"";
    position:absolute;
    width:55px;
    height:55px;
    background:#FF4FA3;
    border-radius:50%;
}

.kalp:before{
    top:-28px;
    left:0;
}

.kalp:after{
    left:28px;
    top:0;
}

/* Yıldız */

.yildiz{
    background:#FFCA3A;
    clip-path:
    polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 95%,
        50% 72%,
        21% 95%,
        32% 57%,
        2% 35%,
        39% 35%
    );
}

/* Altıgen */

.altigen{
    background:#8AC926;

    clip-path:
    polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );
}

/* Beşgen */

.besgen{
    background:#1982C4;

    clip-path:
    polygon(
        50% 0%,
        100% 38%,
        82% 100%,
        18% 100%,
        0% 38%
    );
}

/* Kalın çizgi */

.cizgi{
    width:100px;
    height:15px;
    border-radius:10px;
}

/* Doğru */

.correct{
    background:#6BCB77 !important;
    animation:
    correctAnimation .5s ease;
}

@keyframes correctAnimation{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }

    100%{
        transform:scale(1);
    }

}

/* Yanlış */

.wrong{
    background:#FF6B6B !important;
    animation:
    wrongAnimation .35s ease;
}

@keyframes wrongAnimation{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-10px);
    }

    50%{
        transform:translateX(10px);
    }

    75%{
        transform:translateX(-10px);
    }

    100%{
        transform:translateX(0);
    }

}

#message{
    min-height:50px;

    color:white;

    font-size:30px;
    font-weight:bold;

    text-shadow:
    2px 2px 5px rgba(0,0,0,.2);
}

.homeButton{
    margin:20px auto 30px;

    padding:15px 25px;

    border:none;
    border-radius:18px;

    background:#FF9F1C;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 6px 12px rgba(0,0,0,.2);
}

.confetti{
    position:fixed;
    top:-30px;

    pointer-events:none;
    z-index:999;

    animation:
    fall 2s linear forwards;
}

@keyframes fall{

    from{
        transform:
        translateY(0)
        rotate(0deg);
    }

    to{
        transform:
        translateY(110vh)
        rotate(720deg);
    }

}

@media(max-width:700px){

    header h1{
        font-size:30px;
    }

    header p{
        font-size:17px;
    }

    .infoBox{
        font-size:16px;
        padding:9px 12px;
    }

    #question{
        font-size:23px;
    }

    #shapes{
        grid-template-columns:
        repeat(3,1fr);

        gap:10px;
    }

    .shapeButton{
        height:125px;
        font-size:16px;
    }

    .shape{
        width:60px;
        height:60px;
    }

}

@media(max-width:430px){

    #shapes{
        grid-template-columns:
        repeat(2,1fr);
    }

}

</style>
</head>

<body>

<header>

<h1>🔷 Şekilleri Öğren</h1>

<p>Doğru şekli bul!</p>

</header>


<div class="info">

<div class="infoBox" id="score">
⭐ Puan: 0
</div>

<div class="infoBox" id="lives">
❤️❤️❤️
</div>

<div class="infoBox" id="level">
🏆 Seviye: 1
</div>

</div>


<div id="question">
Hazırlanıyor...
</div>


<div id="shapes"></div>


<div id="message"></div>


<button
class="homeButton"
onclick="location.href='../index.html'">

🏠 Ana Menü

</button>


<script>

/* =================================
   🔷 ŞEKİLLER
================================= */

const shapes = [

    {
        name:"Kare",
        className:"kare"
    },

    {
        name:"Daire",
        className:"daire"
    },

    {
        name:"Üçgen",
        className:"ucgen"
    },

    {
        name:"Dikdörtgen",
        className:"dikdortgen"
    },

    {
        name:"Oval",
        className:"oval"
    },

    {
        name:"Elmas",
        className:"elmas"
    },

    {
        name:"Kalp",
        className:"kalp"
    },

    {
        name:"Yıldız",
        className:"yildiz"
    },

    {
        name:"Altıgen",
        className:"altigen"
    },

    {
        name:"Beşgen",
        className:"besgen"
    }

];


/* =================================
   OYUN
================================= */

let correctShape;

let score=0;

let lives=3;

let level=1;

let locked=false;


/* =================================
   KARIŞTIR
================================= */

function shuffle(array){

    const copy=[...array];

    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*(i+1)
        );

        [
            copy[i],
            copy[j]
        ]=[
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =================================
   RENKLER
================================= */

const colors=[
    "#FF595E",
    "#FF924C",
    "#FFCA3A",
    "#8AC926",
    "#1982C4",
    "#6A4C93",
    "#F15BB5",
    "#00BBF9",
    "#00A896",
    "#9B5DE5"
];


/* =================================
   ŞEKİLLERİ OLUŞTUR
================================= */

function createShapes(){

    const container=
    document.getElementById(
        "shapes"
    );

    container.innerHTML="";


    const mixedShapes=
    shuffle(shapes);


    mixedShapes.forEach(
        (shape,index)=>{

            const button=
            document.createElement(
                "button"
            );

            button.className=
            "shapeButton";

            button.dataset.shape=
            shape.name;


            const shapeDiv=
            document.createElement(
                "div"
            );


            shapeDiv.className=
            "shape "+
            shape.className;


            shapeDiv.style.background=
            colors[
                index%colors.length
            ];


            /* Üçgen ve diğer clip-path
               şekillerinin rengi */

            if(
                shape.className===
                "ucgen"
            ){

                shapeDiv.style.borderBottomColor=
                colors[
                    index%colors.length
                ];

            }


            const text=
            document.createElement(
                "span"
            );

            text.textContent=
            shape.name;


            button.appendChild(
                shapeDiv
            );

            button.appendChild(
                text
            );


            button.addEventListener(
                "click",
                ()=>{
                    checkAnswer(button);
                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =================================
   SES
================================= */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    return audioContext;

}


function beep(
    frequency,
    duration,
    type="sine"
){

    const audio=
    getAudio();


    const oscillator=
    audio.createOscillator();


    const gain=
    audio.createGain();


    oscillator.type=
    type;


    oscillator.frequency.value=
    frequency;


    oscillator.connect(gain);

    gain.connect(
        audio.destination
    );


    gain.gain.value=.18;


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+
        duration
    );


    oscillator.stop(
        audio.currentTime+
        duration
    );

}


function correctSound(){

    beep(700,.12,"triangle");

    setTimeout(()=>{
        beep(900,.12,"triangle");
    },120);

    setTimeout(()=>{
        beep(1200,.18,"triangle");
    },240);

}


function wrongSound(){

    beep(
        250,
        .35,
        "sawtooth"
    );

}


/* =================================
   KONUŞMA
================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    speechSynthesis.cancel();


    const voice=
    new SpeechSynthesisUtterance(
        text
    );


    voice.lang="tr-TR";

    voice.rate=.85;

    voice.pitch=1.1;


    speechSynthesis.speak(
        voice
    );

}


/* =================================
   YENİ SORU
================================= */

function newQuestion(){

    locked=false;


    correctShape=
    shapes[
        Math.floor(
            Math.random()*
            shapes.length
        )
    ];


    document.getElementById(
        "question"
    ).innerHTML=
    "👉 <b>"+
    correctShape.name+
    "</b> şeklini bul!";


    createShapes();


    setTimeout(()=>{

        speak(
            correctShape.name+
            " şeklini bul"
        );

    },300);

}


/* =================================
   CEVAP
================================= */

function checkAnswer(button){

    if(locked){
        return;
    }


    locked=true;


    const selectedShape=
    button.dataset.shape;


    if(
        selectedShape===
        correctShape.name
    ){

        score++;


        if(score%5===0){
            level++;
        }


        updateInfo();


        button.classList.add(
            "correct"
        );


        document.getElementById(
            "message"
        ).textContent=
        "🎉 Aferin!";


        correctSound();


        speak("Aferin!");


        createConfetti();


        setTimeout(()=>{

            document.getElementById(
                "message"
            ).textContent="";


            newQuestion();

        },1200);

    }
    else{

        lives--;


        updateInfo();


        button.classList.add(
            "wrong"
        );


        document.getElementById(
            "message"
        ).textContent=
        "😊 Tekrar dene!";


        wrongSound();


        speak("Tekrar dene");


        setTimeout(()=>{

            button.classList.remove(
                "wrong"
            );


            if(lives<=0){

                gameOver();

            }
            else{

                locked=false;

            }

        },800);

    }

}


/* =================================
   BİLGİ
================================= */

function updateInfo(){

    document.getElementById(
        "score"
    ).textContent=
    "⭐ Puan: "+score;


    document.getElementById(
        "lives"
    ).textContent=
    lives>0
    ?"❤️".repeat(lives)
    :"💔";


    document.getElementById(
        "level"
    ).textContent=
    "🏆 Seviye: "+level;

}


/* =================================
   OYUN BİTTİ
================================= */

function gameOver(){

    locked=true;


    document.getElementById(
        "question"
    ).innerHTML=
    "🎮 Oyun Bitti!";


    document.getElementById(
        "message"
    ).textContent=
    "⭐ Puanın: "+score;


    speak(
        "Oyun bitti. "+
        score+
        " puan kazandın."
    );


    setTimeout(()=>{

        const again=
        confirm(
            "🎮 Tekrar oynamak ister misin?"
        );


        if(again){

            score=0;

            lives=3;

            level=1;


            updateInfo();


            document.getElementById(
                "message"
            ).textContent="";


            newQuestion();

        }
        else{

            location.href=
            "../index.html";

        }

    },1000);

}


/* =================================
   KONFETİ
================================= */

function createConfetti(){

    const symbols=[
        "⭐",
        "🎉",
        "✨",
        "🌟",
        "💖"
    ];


    for(
        let i=0;
        i<25;
        i++
    ){

        const item=
        document.createElement(
            "div"
        );


        item.className=
        "confetti";


        item.textContent=
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];


        item.style.left=
        Math.random()*100+
        "vw";


        item.style.fontSize=
        18+
        Math.random()*22+
        "px";


        item.style.animationDuration=
        1.5+
        Math.random()+
        "s";


        document.body.appendChild(
            item
        );


        setTimeout(()=>{

            item.remove();

        },3000);

    }

}


/* =================================
   BAŞLAT
================================= */

updateInfo();

newQuestion();

</script>

</body>
</html>
