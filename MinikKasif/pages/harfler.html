<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔤 Harfleri Öğren</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
text-align:center;
background:linear-gradient(180deg,#81D4FA,#B3E5FC,#FFF9C4);
}

header{
padding:20px;
color:white;
}

h1{
font-size:38px;
margin:10px;
text-shadow:2px 2px 6px #777;
}

header p{
font-size:20px;
}

.info{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.box{
background:white;
padding:12px 18px;
border-radius:18px;
font-weight:bold;
box-shadow:0 5px 10px #999;
}

#question{
width:92%;
max-width:700px;
margin:20px auto 10px;
padding:20px;
background:white;
border-radius:25px;
font-size:28px;
font-weight:bold;
box-shadow:0 5px 12px #999;
}

.listen{
border:0;
border-radius:18px;
padding:13px 22px;
background:#1976D2;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
}

#letters{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
width:95%;
max-width:800px;
margin:15px auto;
}

.letter{
height:100px;
border:0;
border-radius:20px;
color:white;
font-size:40px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 10px #777;
}

.letter:hover{
transform:scale(1.05);
}

.correct{
background:#4CAF50!important;
}

.wrong{
background:#F44336!important;
}

#message{
min-height:50px;
color:white;
font-size:28px;
font-weight:bold;
}

.home{
margin:20px;
padding:14px 25px;
border:0;
border-radius:18px;
background:#FF9800;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:600px){

h1{
font-size:30px;
}

#letters{
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.letter{
height:75px;
font-size:30px;
}

#question{
font-size:22px;
}

}
</style>
</head>

<body>

<header>
<h1>🔤 Harfleri Öğren</h1>
<p>Doğru harfi bul!</p>
</header>

<div class="info">

<div class="box" id="score">
⭐ Puan: 0
</div>

<div class="box" id="lives">
❤️❤️❤️
</div>

<div class="box" id="level">
🏆 Seviye: 1
</div>

</div>

<div id="question"></div>

<button class="listen" onclick="readQuestion()">
🔊 Soruyu Dinle
</button>

<div id="letters"></div>

<div id="message"></div>

<button class="home"
onclick="location.href='../index.html'">
🏠 Ana Menü
</button>

<script>

const letters=[
"A","B","C","Ç","D","E","F","G","Ğ","H",
"I","İ","J","K","L","M","N","O","Ö","P",
"R","S","Ş","T","U","Ü","V","Y","Z"
];

let correct="";
let score=0;
let lives=3;
let level=1;
let locked=false;

const colors=[
"#F44336","#FF9800","#FFC107","#4CAF50",
"#2196F3","#673AB7","#E91E63","#00BCD4"
];

function shuffle(array){

let a=[...array];

for(let i=a.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[a[i],a[j]]=[a[j],a[i]];

}

return a;
}

function speak(text){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

let voice=
new SpeechSynthesisUtterance(text);

voice.lang="tr-TR";
voice.rate=.8;
voice.pitch=1.1;

speechSynthesis.speak(voice);

}

function readQuestion(){

speak(
correct+
" harfini bul"
);

}

let audio=null;

function beep(frequency,duration,type="sine"){

if(!audio){

audio=
new(window.AudioContext||
window.webkitAudioContext)();

}

let oscillator=
audio.createOscillator();

let gain=
audio.createGain();

oscillator.type=type;

oscillator.frequency.value=
frequency;

oscillator.connect(gain);
gain.connect(audio.destination);

gain.gain.value=.15;

oscillator.start();

gain.gain.exponentialRampToValueAtTime(
.0001,
audio.currentTime+duration
);

oscillator.stop(
audio.currentTime+duration
);

}

function correctSound(){

beep(700,.12,"triangle");

setTimeout(()=>{
beep(900,.12,"triangle");
},120);

setTimeout(()=>{
beep(1200,.18,"triangle");
},240);

}

function wrongSound(){

beep(250,.35,"sawtooth");

}

function newQuestion(){

locked=false;

correct=
letters[
Math.floor(
Math.random()*letters.length
)
];

document.getElementById("question").innerHTML=
"👉 <b>"+correct+
"</b> harfini bul!";

let area=
document.getElementById("letters");

area.innerHTML="";

shuffle(letters).forEach((letter,i)=>{

let button=
document.createElement("button");

button.className="letter";

button.textContent=letter;

button.style.background=
colors[i%colors.length];

button.onclick=
()=>checkAnswer(button,letter);

area.appendChild(button);

});

setTimeout(readQuestion,300);

}

function checkAnswer(button,letter){

if(locked)return;

locked=true;

if(letter===correct){

score++;

if(score%5===0){
level++;
}

button.classList.add("correct");

document.getElementById("message").textContent=
"🎉 Aferin!";

correctSound();

speak("Aferin!");

updateInfo();

setTimeout(()=>{

document.getElementById("message").textContent="";

newQuestion();

},1000);

}else{

lives--;

button.classList.add("wrong");

document.getElementById("message").textContent=
"😊 Tekrar dene!";

wrongSound();

speak("Tekrar dene!");

updateInfo();

setTimeout(()=>{

button.classList.remove("wrong");

if(lives<=0){

gameOver();

}else{

locked=false;

}

},700);

}

}

function updateInfo(){

document.getElementById("score").textContent=
"⭐ Puan: "+score;

document.getElementById("lives").textContent=
lives>0?"❤️".repeat(lives):"💔";

document.getElementById("level").textContent=
"🏆 Seviye: "+level;

}

function gameOver(){

locked=true;

document.getElementById("question").textContent=
"🎮 Oyun Bitti!";

speak(
"Oyun bitti. "+
score+
" puan kazandın."
);

setTimeout(()=>{

if(confirm("Tekrar oynamak ister misin?")){

score=0;
lives=3;
level=1;

updateInfo();
newQuestion();

}else{

location.href="../index.html";

}

},700);

}

updateInfo();
newQuestion();

</script>

</body>
</html>
