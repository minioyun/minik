<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Hafıza Oyunu - Minik Kaşif</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        #81D4FA,
        #B3E5FC,
        #FFF9C4
    );

    overflow-x:hidden;
}

/* BAŞLIK */

header{
    padding:22px;
    color:white;
}

header h1{
    font-size:38px;
    text-shadow:2px 2px 6px rgba(0,0,0,.2);
}

header p{
    margin-top:8px;
    font-size:20px;
}

/* BİLGİ */

.info{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;

    width:95%;
    max-width:800px;

    margin:10px auto 20px;
}

.infoBox{
    background:white;

    padding:11px 17px;

    border-radius:18px;

    font-size:19px;
    font-weight:bold;

    box-shadow:
    0 5px 12px rgba(0,0,0,.15);
}

/* MESAJ */

#message{
    min-height:50px;

    color:white;

    font-size:28px;
    font-weight:bold;

    text-shadow:
    2px 2px 5px rgba(0,0,0,.2);
}

/* OYUN ALANI */

#game{
    width:94%;
    max-width:650px;

    margin:20px auto;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;
}

/* KART */

.card{
    height:125px;

    border:none;

    border-radius:20px;

    background:#6A4C93;

    color:white;

    font-size:48px;

    cursor:pointer;

    box-shadow:
    0 7px 14px rgba(0,0,0,.25);

    transition:.2s;
}

.card:hover{
    transform:scale(1.04);
}

.card:active{
    transform:scale(.94);
}

/* AÇIK KART */

.card.open{
    background:white;
    color:#333;
}

/* EŞLEŞEN KART */

.card.matched{
    background:#6BCB77;
    color:white;

    cursor:default;
}

/* ANA MENÜ */

.homeButton{
    margin:20px auto 30px;

    padding:15px 25px;

    border:none;

    border-radius:18px;

    background:#FF9F1C;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 6px 12px rgba(0,0,0,.2);
}

.homeButton:hover{
    transform:scale(1.05);
}

/* KONFETİ */

.confetti{
    position:fixed;

    top:-30px;

    z-index:999;

    pointer-events:none;

    animation:
    fall 2s linear forwards;
}

@keyframes fall{

    from{
        transform:
        translateY(0)
        rotate(0deg);
    }

    to{
        transform:
        translateY(110vh)
        rotate(720deg);
    }

}

/* TELEFON */

@media(max-width:600px){

    header h1{
        font-size:30px;
    }

    header p{
        font-size:17px;
    }

    #game{
        grid-template-columns:
        repeat(4,1fr);

        gap:9px;
    }

    .card{
        height:90px;

        border-radius:15px;

        font-size:35px;
    }

    .infoBox{
        font-size:15px;

        padding:9px 12px;
    }

}

@media(max-width:380px){

    #game{
        gap:7px;
    }

    .card{
        height:78px;

        font-size:30px;
    }

}

</style>
</head>

<body>

<header>

<h1>🧠 Hafıza Oyunu</h1>

<p>
Aynı hayvanları eşleştir!
</p>

</header>


<!-- BİLGİLER -->

<div class="info">

<div class="infoBox" id="score">
⭐ Puan: 0
</div>

<div class="infoBox" id="moves">
🎯 Hamle: 0
</div>

<div class="infoBox" id="pairs">
🧩 Eşleşme: 0/8
</div>

</div>


<!-- MESAJ -->

<div id="message">
🧠 Kartları eşleştir!
</div>


<!-- KARTLAR -->

<div id="game"></div>


<!-- ANA MENÜ -->

<button
class="homeButton"
onclick="location.href='../index.html'">

🏠 Ana Menü

</button>


<script>

/* =================================
   🐾 HAYVANLAR
================================= */

const animals=[

    "🐶",
    "🐱",
    "🦁",
    "🐯",
    "🐘",
    "🐰",
    "🐼",
    "🐸"

];


/* =================================
   HAYVAN İSİMLERİ
================================= */

const animalNames={

    "🐶":"köpek",

    "🐱":"kedi",

    "🦁":"aslan",

    "🐯":"kaplan",

    "🐘":"fil",

    "🐰":"tavşan",

    "🐼":"panda",

    "🐸":"kurbağa"

};


/* =================================
   OYUN DEĞİŞKENLERİ
================================= */

let cards=[];

let firstCard=null;

let secondCard=null;

let lockBoard=false;

let score=0;

let moves=0;

let matched=0;


/* =================================
   KARIŞTIRMA
================================= */

function shuffle(array){

    const copy=[...array];

    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*(i+1)
        );

        [
            copy[i],
            copy[j]
        ]=
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =================================
   OYUNU BAŞLAT
================================= */

function startGame(){

    cards=
    shuffle([

        ...animals,
        ...animals

    ]);


    firstCard=null;

    secondCard=null;

    lockBoard=false;

    score=0;

    moves=0;

    matched=0;


    updateInfo();


    document.getElementById(
        "message"
    ).textContent=
    "🧠 Kartları eşleştir!";


    createCards();

}


/* =================================
   KARTLARI OLUŞTUR
================================= */

function createCards(){

    const game=
    document.getElementById(
        "game"
    );


    game.innerHTML="";


    cards.forEach(
        (animal,index)=>{

            const card=
            document.createElement(
                "button"
            );


            card.className="card";


            card.dataset.value=
            animal;


            card.dataset.index=
            index;


            card.textContent="❓";


            card.addEventListener(
                "click",
                ()=>openCard(card)
            );


            game.appendChild(card);

        }
    );

}


/* =================================
   🃏 KART AÇMA
================================= */

function openCard(card){

    if(lockBoard){
        return;
    }


    if(card===firstCard){
        return;
    }


    if(
        card.classList.contains(
            "matched"
        )
    ){
        return;
    }


    /* Kartı aç */

    card.classList.add(
        "open"
    );


    card.textContent=
    card.dataset.value;


    /* 🔊 HAYVANIN ADINI SÖYLE */

    speakAnimal(
        card.dataset.value
    );


    /* İlk kart */

    if(!firstCard){

        firstCard=card;

        return;

    }


    /* İkinci kart */

    secondCard=card;


    moves++;


    updateInfo();


    checkMatch();

}


/* =================================
   🔊 HAYVAN İSMİNİ SESLENDİR
================================= */

function speakAnimal(emoji){

    const name=
    animalNames[emoji];


    if(!name){
        return;
    }


    speak(name);

}


/* =================================
   EŞLEŞTİRME
================================= */

function checkMatch(){

    const isMatch=
    firstCard.dataset.value===
    secondCard.dataset.value;


    /* DOĞRU */

    if(isMatch){

        matched++;

        score+=10;


        firstCard.classList.add(
            "matched"
        );


        secondCard.classList.add(
            "matched"
        );


        correctSound();


        document.getElementById(
            "message"
        ).textContent=
        "🎉 Aferin! Eşleştirdin!";


        speak(
            "Aferin! "+
            animalNames[
                firstCard.dataset.value
            ]
        );


        updateInfo();


        resetCards();


        /* BÜTÜN KARTLAR BİTTİ */

        if(
            matched===
            animals.length
        ){

            setTimeout(
                gameWon,
                700
            );

        }

    }


    /* YANLIŞ */

    else{

        score=
        Math.max(
            0,
            score-1
        );


        wrongSound();


        document.getElementById(
            "message"
        ).textContent=
        "😊 Tekrar dene!";


        speak(
            "Tekrar dene"
        );


        lockBoard=true;


        setTimeout(()=>{

            firstCard.classList.remove(
                "open"
            );


            secondCard.classList.remove(
                "open"
            );


            firstCard.textContent=
            "❓";


            secondCard.textContent=
            "❓";


            resetCards();


        },900);

    }

}


/* =================================
   KARTLARI SIFIRLA
================================= */

function resetCards(){

    firstCard=null;

    secondCard=null;

    lockBoard=false;

}


/* =================================
   BİLGİLERİ GÜNCELLE
================================= */

function updateInfo(){

    document.getElementById(
        "score"
    ).textContent=
    "⭐ Puan: "+
    score;


    document.getElementById(
        "moves"
    ).textContent=
    "🎯 Hamle: "+
    moves;


    document.getElementById(
        "pairs"
    ).textContent=
    "🧩 Eşleşme: "+
    matched+
    "/"+
    animals.length;

}


/* =================================
   🏆 OYUNU KAZAN
================================= */

function gameWon(){

    document.getElementById(
        "message"
    ).textContent=
    "🏆 Tebrikler! Hepsini buldun!";


    correctSound();


    speak(
        "Tebrikler! "+
        "Oyunu tamamladın."
    );


    createConfetti();


    setTimeout(()=>{

        const again=
        confirm(
            "🎮 Tekrar oynamak ister misin?"
        );


        if(again){

            startGame();

        }
        else{

            location.href=
            "../index.html";

        }

    },1500);

}


/* =================================
   🔊 SES SİSTEMİ
================================= */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    return audioContext;

}


function beep(
    frequency,
    duration,
    type="sine"
){

    const audio=
    getAudio();


    const oscillator=
    audio.createOscillator();


    const gain=
    audio.createGain();


    oscillator.type=
    type;


    oscillator.frequency.value=
    frequency;


    oscillator.connect(
        gain
    );


    gain.connect(
        audio.destination
    );


    gain.gain.value=
    .18;


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+
        duration
    );


    oscillator.stop(
        audio.currentTime+
        duration
    );

}


/* =================================
   ✅ DOĞRU SES
================================= */

function correctSound(){

    beep(
        700,
        .12,
        "triangle"
    );


    setTimeout(()=>{

        beep(
            900,
            .12,
            "triangle"
        );

    },120);


    setTimeout(()=>{

        beep(
            1200,
            .18,
            "triangle"
        );

    },240);

}


/* =================================
   ❌ YANLIŞ SES
================================= */

function wrongSound(){

    beep(
        250,
        .35,
        "sawtooth"
    );

}


/* =================================
   🗣️ TÜRKÇE KONUŞMA
================================= */

function speak(text){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        return;

    }


    speechSynthesis.cancel();


    const voice=
    new SpeechSynthesisUtterance(
        text
    );


    voice.lang=
    "tr-TR";


    voice.rate=
    .85;


    voice.pitch=
    1.1;


    speechSynthesis.speak(
        voice
    );

}


/* =================================
   🎉 KONFETİ
================================= */

function createConfetti(){

    const symbols=[

        "⭐",
        "🎉",
        "✨",
        "🌟",
        "💖",
        "🏆"

    ];


    for(
        let i=0;
        i<35;
        i++
    ){

        const item=
        document.createElement(
            "div"
        );


        item.className=
        "confetti";


        item.textContent=
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];


        item.style.left=
        Math.random()*100+
        "vw";


        item.style.fontSize=
        18+
        Math.random()*22+
        "px";


        item.style.animationDuration=
        1.5+
        Math.random()+
        "s";


        document.body.appendChild(
            item
        );


        setTimeout(()=>{

            item.remove();

        },3000);

    }

}


/* =================================
   🚀 BAŞLAT
================================= */

startGame();

</script>

</body>
</html>
