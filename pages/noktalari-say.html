```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔢 Noktaları Say - Minik Kaşif</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        #81D4FA,
        #B3E5FC,
        #FFF9C4
    );

    overflow-x:hidden;
}

header{
    padding:20px;
    color:white;
}

header h1{
    font-size:36px;
    margin:8px;
    text-shadow:2px 2px 6px #777;
}

header p{
    font-size:20px;
}

.info{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.box{
    background:white;
    padding:12px 18px;
    border-radius:18px;
    font-weight:bold;
    box-shadow:0 5px 10px rgba(0,0,0,.25);
}

/* SORU */

#question{
    width:92%;
    max-width:750px;

    margin:20px auto 10px;
    padding:20px;

    background:white;
    border-radius:25px;

    font-size:28px;
    font-weight:bold;

    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

/* DİNLE */

.listen{
    border:none;
    border-radius:18px;

    padding:13px 22px;

    background:#1976D2;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    margin:10px;
}

/* NOKTA ALANI */

#dotsArea{
    width:94%;
    max-width:800px;
    min-height:280px;

    margin:20px auto;

    background:rgba(255,255,255,.75);

    border-radius:30px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:center;
    align-items:center;

    gap:14px;

    padding:25px;

    box-shadow:
    0 8px 18px rgba(0,0,0,.18);
}

/* NOKTA */

.dot{
    width:48px;
    height:48px;

    border-radius:50%;

    display:block;

    box-shadow:
    inset 0 3px 5px rgba(255,255,255,.35),
    0 4px 8px rgba(0,0,0,.2);

    animation:
    pop .25s ease;
}

@keyframes pop{

    from{
        transform:scale(.2);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* SAYI SEÇENEKLERİ */

#answers{
    width:95%;
    max-width:700px;

    margin:20px auto;

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:12px;
}

.answer{
    height:90px;

    border:none;
    border-radius:20px;

    color:white;

    font-size:35px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 6px 12px rgba(0,0,0,.25);

    transition:.2s;
}

.answer:hover{
    transform:scale(1.05);
}

.answer:active{
    transform:scale(.93);
}

.correct{
    background:#4CAF50 !important;
}

.wrong{
    background:#F44336 !important;

    animation:
    shake .3s;
}

@keyframes shake{

    25%{
        transform:translateX(-10px);
    }

    50%{
        transform:translateX(10px);
    }

    75%{
        transform:translateX(-10px);
    }

}

/* MESAJ */

#message{
    min-height:50px;

    color:white;

    font-size:28px;
    font-weight:bold;
}

/* ANA MENÜ */

.home{
    margin:20px;

    padding:14px 25px;

    border:none;
    border-radius:18px;

    background:#FF9800;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 6px 12px rgba(0,0,0,.2);
}

/* MOBİL */

@media(max-width:600px){

    header h1{
        font-size:29px;
    }

    #question{
        font-size:22px;
    }

    #dotsArea{
        min-height:230px;
        padding:18px;
        gap:10px;
    }

    .dot{
        width:35px;
        height:35px;
    }

    #answers{
        grid-template-columns:
        repeat(3,1fr);

        gap:9px;
    }

    .answer{
        height:75px;
        font-size:30px;
    }

}

</style>
</head>

<body>

<header>

<h1>🔢 Noktaları Say</h1>

<p>Noktaları say ve doğru sayıyı bul!</p>

</header>


<div class="info">

<div class="box" id="score">
⭐ Puan: 0
</div>

<div class="box" id="lives">
❤️❤️❤️
</div>

<div class="box" id="level">
🏆 Seviye: 1
</div>

</div>


<div id="question">
Hazırlanıyor...
</div>


<button
class="listen"
onclick="readQuestion()">

🔊 Soruyu Dinle

</button>


<div id="dotsArea"></div>


<div id="answers"></div>


<div id="message"></div>


<button
class="home"
onclick="location.href='../index.html'">

🏠 Ana Menü

</button>


<script>

/* =================================
   🔢 SAYILAR
================================= */

const numberNames = {

    1:"bir",
    2:"iki",
    3:"üç",
    4:"dört",
    5:"beş",
    6:"altı",
    7:"yedi",
    8:"sekiz",
    9:"dokuz",
    10:"on",
    11:"on bir",
    12:"on iki",
    13:"on üç",
    14:"on dört",
    15:"on beş"

};


/* =================================
   OYUN
================================= */

let correctNumber = 1;

let score = 0;

let lives = 3;

let level = 1;

let locked = false;


/* =================================
   KARIŞTIR
================================= */

function shuffle(array){

    const a = [...array];

    for(
        let i = a.length - 1;
        i > 0;
        i--
    ){

        const j =
        Math.floor(
            Math.random() * (i + 1)
        );

        [a[i],a[j]] =
        [a[j],a[i]];

    }

    return a;

}


/* =================================
   SES
================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    speechSynthesis.cancel();

    const voice =
    new SpeechSynthesisUtterance(text);

    voice.lang = "tr-TR";

    voice.rate = .82;

    voice.pitch = 1.1;

    speechSynthesis.speak(voice);

}


function readQuestion(){

    speak(
        "Noktaları say. "+
        "Kaç tane nokta var?"
    );

}


/* =================================
   SES EFEKTLERİ
================================= */

let audio = null;


function getAudio(){

    if(!audio){

        audio =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    return audio;

}


function beep(
    frequency,
    duration,
    type="sine"
){

    const context =
    getAudio();


    const oscillator =
    context.createOscillator();


    const gain =
    context.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
    frequency;


    oscillator.connect(gain);

    gain.connect(
        context.destination
    );


    gain.gain.value = .15;


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        context.currentTime +
        duration
    );


    oscillator.stop(
        context.currentTime +
        duration
    );

}


/* DOĞRU */

function correctSound(){

    beep(
        700,
        .12,
        "triangle"
    );


    setTimeout(()=>{

        beep(
            900,
            .12,
            "triangle"
        );

    },120);


    setTimeout(()=>{

        beep(
            1200,
            .18,
            "triangle"
        );

    },240);

}


/* YANLIŞ */

function wrongSound(){

    beep(
        250,
        .35,
        "sawtooth"
    );

}


/* =================================
   NOKTALARI OLUŞTUR
================================= */

function createDots(){

    const area =
    document.getElementById(
        "dotsArea"
    );


    area.innerHTML = "";


    const dotColors = [

        "#F44336",
        "#FF9800",
        "#FFC107",
        "#4CAF50",
        "#2196F3",
        "#9C27B0",
        "#E91E63",
        "#00BCD4"

    ];


    for(
        let i = 0;
        i < correctNumber;
        i++
    ){

        const dot =
        document.createElement(
            "div"
        );


        dot.className =
        "dot";


        dot.style.background =
        dotColors[
            i % dotColors.length
        ];


        area.appendChild(dot);

    }

}


/* =================================
   CEVAPLARI OLUŞTUR
================================= */

function createAnswers(){

    const area =
    document.getElementById(
        "answers"
    );


    area.innerHTML = "";


    const answers =
    new Set([correctNumber]);


    while(
        answers.size < 5
    ){

        answers.add(
            Math.floor(
                Math.random()*15
            )+1
        );

    }


    const colors = [

        "#F44336",
        "#FF9800",
        "#4CAF50",
        "#2196F3",
        "#9C27B0"

    ];


    shuffle(
        [...answers]
    ).forEach(
        (number,index)=>{

            const button =
            document.createElement(
                "button"
            );


            button.className =
            "answer";


            button.textContent =
            number;


            button.style.background =
            colors[
                index % colors.length
            ];


            button.onclick = () => {

                checkAnswer(
                    button,
                    number
                );

            };


            area.appendChild(
                button
            );

        }
    );

}


/* =================================
   YENİ SORU
================================= */

function newQuestion(){

    locked = false;


    correctNumber =
    Math.floor(
        Math.random()*15
    ) + 1;


    document.getElementById(
        "question"
    ).innerHTML =

    "👉 Noktaları say!";


    createDots();

    createAnswers();


    setTimeout(
        readQuestion,
        300
    );

}


/* =================================
   CEVAP
================================= */

function checkAnswer(
    button,
    number
){

    if(locked){
        return;
    }


    locked = true;


    /* DOĞRU */

    if(
        number ===
        correctNumber
    ){

        score++;


        if(
            score % 5 === 0
        ){

            level++;

        }


        button.classList.add(
            "correct"
        );


        document.getElementById(
            "message"
        ).textContent =
        "🎉 Aferin! Doğru saydın!";


        correctSound();


        speak(
            "Aferin! "+
            numberNames[correctNumber]+
            " tane nokta var."
        );


        updateInfo();


        setTimeout(()=>{

            document.getElementById(
                "message"
            ).textContent = "";


            newQuestion();

        },1100);

    }


    /* YANLIŞ */

    else{

        lives--;


        button.classList.add(
            "wrong"
        );


        document.getElementById(
            "message"
        ).textContent =
        "😊 Tekrar say!";


        wrongSound();


        speak(
            "Tekrar say!"
        );


        updateInfo();


        setTimeout(()=>{

            button.classList.remove(
                "wrong"
            );


            if(
                lives <= 0
            ){

                gameOver();

            }
            else{

                locked = false;

            }

        },750);

    }

}


/* =================================
   BİLGİLER
================================= */

function updateInfo(){

    document.getElementById(
        "score"
    ).textContent =
    "⭐ Puan: " +
    score;


    document.getElementById(
        "lives"
    ).textContent =

    lives > 0
    ? "❤️".repeat(lives)
    : "💔";


    document.getElementById(
        "level"
    ).textContent =
    "🏆 Seviye: " +
    level;

}


/* =================================
   OYUN BİTTİ
================================= */

function gameOver(){

    locked = true;


    document.getElementById(
        "question"
    ).textContent =
    "🎮 Oyun Bitti!";


    speak(
        "Oyun bitti. "+
        score+
        " puan kazandın."
    );


    setTimeout(()=>{

        if(
            confirm(
                "🎮 Tekrar oynamak ister misin?"
            )
        ){

            score = 0;

            lives = 3;

            level = 1;


            updateInfo();

            newQuestion();

        }
        else{

            location.href =
            "../index.html";

        }

    },800);

}


/* =================================
   BAŞLAT
================================= */

updateInfo();

newQuestion();

</script>

</body>
</html>
